name: Force GitHub Pages Rebuild

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force cache bust
        run: |
          echo "Triggering cache bust by touching App.js"
          echo "// cache bust $(date)" >> src/App.js

      - name: Push cache bust
        run: |
          git config user.name "automation"
          git config user.email "automation@example.com"
          git add src/App.js
          git commit -m "Automated cache bust to trigger GitHub Pages rebuild" || echo "No changes to commit"
          git push origin main
